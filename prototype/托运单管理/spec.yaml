units:
  - id: business_type_entry
    index: ①
    short_index: '1'
    title: 新建入口与类型分流
    anchor_selector: .annotation-create-entry
    node_class: annotation-business-type-entry
    aria_label: ① 新建入口与类型分流
    badge_offset_x: 145
    badge_offset_y: 7
    confirmation: confirmed
    human_disposition: resolved
    purpose: 新建时先选择散杂货或集装箱；业务类型决定创建表单、明细结构和提交校验。
    rules:
      - priority: P0
        text: 点击“新增公开托运单”必须先选择业务类型，未选择前不得进入创建表单。
      - priority: P0
        text: 散杂货和集装箱创建独立托运单对象；进入表单后不得切换类型，如需变更必须关闭后重新新建。
      - priority: P0
        text: 托运企业必填并默认带出当前企业；联系人和联系电话可为空，不能单独阻断保存草稿或提交发布。
    field_columns:
      - 字段
      - 规则
      - 影响
    fields:
      - 字段: 业务类型
        规则: 必选且创建后锁定
        影响: 决定散杂货或集装箱的明细、校验与下游承接
      - 字段: 托运企业
        规则: 必填，默认当前企业
        影响: 生成托运单主体与管理列表摘要
      - 字段: 联系人和联系电话
        规则: 非必填
        影响: 随托运单保存，不作为发布阻断条件
    origin: human
    human_locked: true
    source_refs:
      - PRD 2.1-2.2、5.1、7.1
    updated_by: human
    updated_at: '2026-07-15T12:05:53.347Z'
  - id: bulk_cargo_nodes
    index: ②
    short_index: '2'
    title: 散杂货节点与货品校验
    anchor_selector: .transport-timeline
    badge_offset_x: -42
    badge_offset_y: 8
    node_class: annotation-bulk-cargo-node
    aria_label: ② 散杂货节点与货品校验
    visibility_condition: bulk_cargo_drawer_open
    visibility_condition_desc: 选择“散杂货”后展示创建抽屉中的装货与卸货节点时间线。
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved
    source_refs:
      - PRD 3.1-3.2、4.2-4.4、5.2、7.2
    purpose: 散杂货按装卸节点维护货品明细，整票统一使用一种配载口径。
    rules:
      - priority: P0
        text: 提交发布时至少存在一条装货节点和一条卸货节点；每个装货节点至少维护一条有效货品，节点地址不可为空。
      - priority: P0
        text: 配载方式只能在按重量、按体积、按数量中选择一种；当前配载字段必须大于0，货品总价=单价×当前配载值。
      - priority: P0
        text: 货品名称、单价和包装为提交必填项；同一货品可在多个装货节点出现，展示汇总不得替代原始货品行。
    field_columns:
      - 字段
      - 提交要求
      - 计算或边界
    fields:
      - 字段: 装货和卸货节点
        提交要求: 各至少一条，节点地址必填
        计算或边界: 多装多卸按节点保留，不压缩为单一路线
      - 字段: 配载方式
        提交要求: 整票单选且必填
        计算或边界: 决定重量、体积或数量中的当前主计量字段
      - 字段: 货品行
        提交要求: 货品、单价、包装和当前主计量有效
        计算或边界: 总价按单价×当前主计量值计算
  - id: bulk_cargo_flow
    index: ③
    short_index: '3'
    title: 卸货批次与装卸平衡
    anchor_selector: .transport-summary
    badge_offset_x: -42
    badge_offset_y: 8
    node_class: annotation-bulk-cargo-flow
    aria_label: ③ 卸货批次与装卸平衡
    visibility_condition: bulk_cargo_drawer_open
    visibility_condition_desc: 选择“散杂货”后展示运输货品汇总区。
    origin: ai
    human_locked: false
    confirmation: conflict
    pending_impact: high
    human_disposition: undecided
    source_refs:
      - PRD 4.3-4.4、5.2、6.2、7.2
    purpose: 每条卸货明细必须引用前序装货批次，并校验来源批次的剩余可卸量。
    rules:
      - priority: P0
        text: 卸货行只能选择当前卸货节点之前的装货批次；选中后带出货品名称、单价、包装和配载单位并锁定。
      - priority: P0
        text: 本次卸货量必须大于0且不超过该来源批次剩余可卸量；按来源批次校验装卸平衡，不得只按货品名称汇总抵消。
      - priority: P0
        text: 保存时每条流向必须保留来源批次、装货节点编号和名称、卸货节点编号和名称、货品、包装、计量值和单价；报价页与后续计划按此明细承接。
      - priority: P1
        text: 待处理：需补齐卸货行级来源批次选择、带出锁定、剩余量校验和受影响装货行修改提示，避免当前原型按节点兜底匹配导致流向错误。
  - id: container_boxes_and_nodes
    index: ④
    short_index: '4'
    title: 集装箱信息与节点要求
    anchor_selector: .container-timeline
    badge_offset_x: -42
    badge_offset_y: 8
    node_class: annotation-container-detail
    aria_label: ④ 集装箱信息与节点要求
    visibility_condition: container_drawer_open
    visibility_condition_desc: 选择“集装箱”后展示箱信息表和节点时间线。
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved
    source_refs:
      - PRD 4.5-4.6、5.3、6.2、7.3
    purpose: 集装箱托运单由整票箱信息和运输节点共同组成；箱信息不绑定单个节点。
    rules:
      - priority: P0
        text: 每条有效箱信息必须填写箱种、尺寸、货品名称和数量；数量为大于0的整数，申报重量可为空且不执行单箱超载校验。
      - priority: P0
        text: 同一托运单内“箱种+尺寸+货品名称”完全相同的箱信息不得重复录入，应合并数量后保存。
      - priority: P0
        text: 承运商提供箱子时至少录入装货和卸货节点；货主提供箱子时只承接已录入且明确纳入运输范围的节点，不自行补齐提还箱链路。
    field_columns:
      - 对象
      - 最小保存颗粒度
      - 关键约束
    fields:
      - 对象: 箱信息
        最小保存颗粒度: 箱种、尺寸、货品、数量、申报重量
        关键约束: 同一箱种、尺寸和货品唯一
      - 对象: 节点链
        最小保存颗粒度: 节点编号、类型、地点、预计时间和联系人
        关键约束: 按已录入顺序供报价和计划承接
  - id: quote_and_publish_settings
    index: ⑤
    short_index: '5'
    title: 报价方式与发布范围
    anchor_selector: .preference-section
    badge_offset_x: -42
    badge_offset_y: 8
    node_class: annotation-quote-publish-settings
    aria_label: ⑤ 报价方式与发布范围
    visibility_condition: create_drawer_open
    visibility_condition_desc: 散杂货或集装箱创建抽屉打开后展示报价和发布设置区域。
    origin: ai
    human_locked: false
    confirmation: conflict
    pending_impact: medium
    human_disposition: undecided
    source_refs:
      - PRD 4.8、5.4、7.4
    purpose: 报价方式、运输方式、报价时间和可见范围共同决定发布对象与后续状态。
    rules:
      - priority: P0
        text: 可报价运输方式至少选择一种，并且必须从已选方式中指定且仅指定一个主方式。
      - priority: P0
        text: 报价开始和截止时间必填，截止时间必须晚于开始时间；竞价模式的散杂货期望价可为空，抢单模式的抢单价必须大于0。
      - priority: P0
        text: 发布范围为指定平台或指定承运商时，必须展示对应多选项并在提交时校验至少选择一项；全平台公开不要求补充对象。
      - priority: P1
        text: 待处理：当前原型将主方式自动取已选运输方式首项，且未实现指定承运商选择、报价时间完整校验和发布范围条件校验，需按本单元补齐。
    field_columns:
      - 发布范围
      - 条件字段
      - 提交校验
    fields:
      - 发布范围: 全平台可见
        条件字段: 无
        提交校验: 可直接进入公开发布链路
      - 发布范围: 指定平台可见
        条件字段: 指定平台多选
        提交校验: 至少选择一个平台
      - 发布范围: 指定承运商
        条件字段: 指定承运商多选
        提交校验: 至少选择一个承运商
  - id: draft_publish_and_writeback
    index: ⑥
    short_index: '6'
    title: 草稿、发布与状态回写
    anchor_selector: .modal-footer
    badge_offset_x: -42
    badge_offset_y: 8
    node_class: annotation-waybill-actions
    aria_label: ⑥ 草稿、发布与状态回写
    visibility_condition: create_drawer_open
    visibility_condition_desc: 散杂货或集装箱创建抽屉打开后展示底部固定操作栏。
    origin: ai
    human_locked: false
    confirmation: conflict
    pending_impact: high
    human_disposition: undecided
    source_refs:
      - PRD 2.1、3.3、5.5、5.7、6.2
    purpose: 保存草稿和提交发布使用不同校验层级；成功后回写管理列表及对应下游数据。
    rules:
      - priority: P0
        text: 保存草稿只校验托运企业等基础入口字段，允许业务明细、价格和报价时间暂未补齐；成功后生成草稿记录并返回管理列表。
      - priority: P0
        text: 提交发布执行完整业务校验，包括类型明细、节点、货品或箱信息、报价偏好、时间窗口及发布范围的条件字段；失败时定位字段或具体行。
      - priority: P0
        text: 公开竞价发布成功后托运单进入竞价中并写入货源大厅可读取范围；指定发布按范围进入待确定或相应审核链路。
      - priority: P1
        text: 待处理：当前原型散杂货发布仅校验节点、货品名称和任一货量，集装箱发布未校验完整报价设置，且均固定写入竞价中，需补齐状态分支和全量校验。
    state_transitions:
      - from: 新建或编辑中
        trigger: 保存草稿且基础校验通过
        to: 草稿
        effect: 回写管理列表摘要
      - from: 新建或草稿
        trigger: 提交发布且完整校验通过
        to: 待审核、待确定或竞价中
        effect: 按发布范围和报价模式写入下游可读取范围
  - id: management_list_status
    index: ⑦
    short_index: '7'
    title: 列表状态与可用操作
    anchor_selector: .table-card
    badge_offset_x: -42
    badge_offset_y: 8
    node_class: annotation-waybill-list-status
    aria_label: ⑦ 列表状态与可用操作
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved
    source_refs:
      - PRD 3.3、5.6-5.7、7.5
    purpose: 管理列表承接创建结果，托运单状态决定当前允许执行的操作。
    rules:
      - priority: P0
        text: 列表摘要至少展示托运单号、业务类型、运输方式、托运企业、联系人、状态、发布时间、路线和可用操作；创建页保存或发布成功后立即回写。
      - priority: P0
        text: 待审核、待确定和竞价中允许取消；待执行和执行中允许终止；已终止允许恢复且恢复后直接回到执行中。
      - priority: P0
        text: 终止与恢复属于破坏性状态动作，执行前必须二次确认；恢复不得回退为待执行。
    status_action_matrix:
      states:
        - 待审核
        - 待确定
        - 竞价中
        - 待执行
        - 执行中
        - 已终止
      actions:
        - 取消
        - 终止
        - 恢复
      cells:
        待审核:
          - 可点
          - 禁用
          - 禁用
        待确定:
          - 可点
          - 禁用
          - 禁用
        竞价中:
          - 可点
          - 禁用
          - 禁用
        待执行:
          - 禁用
          - 可点
          - 禁用
        执行中:
          - 禁用
          - 可点
          - 禁用
        已终止:
          - 禁用
          - 禁用
          - 可点
      legend:
        可点: 按钮展示且可点击；终止和恢复需二次确认
        禁用: 不展示该状态不允许的动作
