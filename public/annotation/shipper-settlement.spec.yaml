  rule_refs:
    - context/business-rules/03-跨模块业务原则/联运计划结算分层原则.md

units:
  - id: add_basic_subject
    index: ①
    short_index: '1'
    title: 结算主体、日期与全单金额
    anchor_selector: .annotation-add-basic
    node_class: annotation-add-basic-node
    aria_label: ① 结算主体、日期与全单金额
    page_scope: add
    purpose: 定义结算单归属主体、日期默认值以及全单金额的实时汇总方式。
    rules:
      - priority: P0
        text: 当前页面的结算对象固定为“货主结算”；结算方必填，并作为可选联运计划的唯一主体筛选条件。
      - priority: P0
        text: 结算日期必填，进入新增页时默认本地当天日期，允许修改。
      - priority: P0
        text: 已添加计划后切换结算方必须二次确认；确认后清空全部计划、结算量、调整单价和补贴扣减，取消则恢复原结算方并保留当前数据。
      - priority: P1
        text: 结算总额实时等于所有计划核算运费之和；备注选填且不参与计算和状态流转。
    field_columns: [字段, 来源或默认值, 编辑规则, 下游影响]
    fields:
      - 字段: 结算对象
        来源或默认值: 固定“货主结算”
        编辑规则: 必填，不提供承运商结算选项
        下游影响: 生成货主应收结算单
      - 字段: 结算方
        来源或默认值: 结算主体档案
        编辑规则: 必填；已有计划时切换需确认
        下游影响: 限定本单所有联运计划的结算方
      - 字段: 结算日期
        来源或默认值: 本地当天日期
        编辑规则: 必填，可修改
        下游影响: 保存为结算单日期快照
      - 字段: 结算总额
        来源或默认值: Σ计划核算运费
        编辑规则: 只读，数量、单价、补贴或扣减变化后立即重算
        下游影响: 提交后保存为全单金额快照
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved

  - id: add_plan_selector
    index: ②
    short_index: '2'
    title: 联运计划筛选与数量摘要
    anchor_selector: .annotation-add-plan-selector
    node_class: annotation-add-plan-selector-node
    aria_label: ② 联运计划筛选与数量摘要
    page_scope: add
    visibility_condition: plan_selector_open
    visibility_condition_desc: 选择结算方并点击“添加联运计划”后打开抽屉
    purpose: 定义计划能否加入本结算单，以及运输总量和待结算总量在不同量纲下如何展示。
    rules:
      - priority: P0
        text: 可选计划必须同时满足同一结算方、已生效且未作废/失效、客户侧费用规则完整、结算依据已形成、至少一行未结算量大于0、无异常争议冻结且未被其他有效结算单重复占用。
      - priority: P0
        text: 不满足条件或已经加入本单的计划不可勾选，并在列表中直接展示具体原因，不只显示“不可选”。
      - priority: P0
        text: 整票按货品/箱型逐行展示数量；分段按“子计划 + 货品/箱型 + 量纲”展示，吨、立方、件、箱不得相加成一个总数。
      - priority: P1
        text: 支持多选并一次回填；确认后默认把每行本次结算量初始化为该行未结算量，取消抽屉不改变已选计划。
    field_columns: [列表字段, 整票结算, 分段结算, 异常或约束]
    fields:
      - 列表字段: 运输总量
        整票结算: 按货品/箱型逐行展示运输总量及单位
        分段结算: 按路段逐段展示各货品/箱型运输总量及本段单位
        异常或约束: 不同量纲禁止求和
      - 列表字段: 待结算总量
        整票结算: 按货品/箱型展示“运输总量 - 已结算量”
        分段结算: 按子计划及明细行展示“运输总量 - 已结算量”
        异常或约束: 全部为0时计划不可选
      - 列表字段: 计价方式
        整票结算: 展示计费条件、依据及计划级/箱型级单价方式
        分段结算: 展示各子计划独立计费
        异常或约束: 缺少费用规则时不可选
      - 列表字段: 状态与原因
        整票结算: 可选或不可选
        分段结算: 可选或不可选
        异常或约束: 不可选时展示首个阻断原因
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved

  - id: add_settlement_calculation
    index: ③
    short_index: '3'
    title: 数量来源、单价与费用计算
    anchor_selector: .annotation-add-plans
    node_class: annotation-add-plans-node
    aria_label: ③ 数量来源、单价与费用计算
    page_scope: add
    purpose: 定义核算表每个数量和金额字段的数据来源、统计颗粒度、公式及编辑边界。
    rules:
      - priority: P0
        text: 按重量取确认重量、按体积取确认体积、按数量取确认数量、按集装箱按箱型取确认箱数；不同量纲不得汇总。
      - priority: P0
        text: 已结算量累计待审核、待打款、已打款结算单的有效占用；已作废或OA驳回后作废的结算单不累计并释放原占用。
      - priority: P0
        text: 新增核算页展示结算前口径：已结算量不含当前尚未提交的本次结算量，未结算量是本次结算量可填写的上限。
      - priority: P0
        text: 本次结算量默认等于该行未结算量，只允许调减且不得跨货品、箱型或子计划挪用。
      - priority: P1
        text: 散货/普货整票共用计划级单价、分段共用子计划级单价；集装箱按箱型维护。调整仅保存为本结算单快照，不反改联运计划费用规则。
      - priority: P1
        text: 待人工确认：分段明细行本次结算量为0时，是允许跳过该行，还是要求已选子计划每行都必须大于0；当前原型允许为0，整票行必须大于0。
    field_columns: [字段, 整票结算口径, 分段结算口径, 计算或约束]
    fields:
      - 字段: 货品/箱型
        整票结算口径: 按联运计划的货品或箱型拆行
        分段结算口径: 按子计划计费条件拆行；散货/普货按货品，集装箱按箱型
        计算或约束: 数量占用和费用追溯的最小明细行
      - 字段: 运输总量
        整票结算口径: 装货口径取首段累计装货确认量；卸货口径取末段累计卸货确认量；集装箱按箱型取确认箱数
        分段结算口径: 本段装货口径取装货确认量、卸货口径取卸货确认量；集装箱段按箱型取确认箱数
        计算或约束: 只读，按计费条件映射为重量、体积、数量或箱数
      - 字段: 已结算量
        整票结算口径: 按联运计划 + 货品/箱型行累计有效占用
        分段结算口径: 按子计划 + 货品/箱型行 + 量纲累计有效占用
        计算或约束: 只读；排除已作废
      - 字段: 未结算量
        整票结算口径: 当前行运输总量 - 当前行已结算量
        分段结算口径: 当前行运输总量 - 当前行已结算量
        计算或约束: 只读；作为本次结算量上限
      - 字段: 本次结算量
        整票结算口径: 默认当前行未结算量
        分段结算口径: 默认当前子计划明细行未结算量
        计算或约束: 可调减、不可增加；整票0 < 本次量 ≤ 未结算量，分段最小值待确认
      - 字段: 运输单价
        整票结算口径: 散货/普货取计划级单价；集装箱取箱型单价
        分段结算口径: 散货/普货取子计划级单价；集装箱取子计划+箱型单价
        计算或约束: 可调整且必须大于0；仅保存本单快照
      - 字段: 基础运费
        整票结算口径: 本次结算量 × 计划级单价或箱型单价
        分段结算口径: 本次结算量 × 子计划级单价或子计划箱型单价
        计算或约束: 只读，数量或单价变化后重算
      - 字段: 补贴/扣减
        整票结算口径: 当前货品/箱型行项目金额之和
        分段结算口径: 当前子计划货品/箱型行项目金额之和
        计算或约束: 明细行级维护
      - 字段: 核算运费
        整票结算口径: 基础运费 + 补贴 - 扣减
        分段结算口径: 基础运费 + 补贴 - 扣减
        计算或约束: 行金额→路段小计→计划小计→全单总额逐级汇总
    origin: ai
    human_locked: false
    confirmation: conflict
    pending_impact: medium
    human_disposition: undecided

  - id: add_adjustment_dialog
    index: ④
    short_index: '4'
    title: 补贴与扣减明细维护
    anchor_selector: .annotation-add-adjustment-dialog-anchor
    node_class: annotation-add-adjustment-node
    aria_label: ④ 补贴与扣减明细维护
    page_scope: add
    visibility_condition: adjustment_dialog_open
    visibility_condition_desc: 点击任一明细行的补贴或扣减金额后打开弹窗
    purpose: 定义补贴、扣减项目的归属颗粒度、字段校验以及确认和取消行为。
    rules:
      - priority: P0
        text: 调整项目必须绑定当前货品/箱型明细行；分段结算还必须绑定当前子计划，不得跨行或跨路段共用。
      - priority: P0
        text: 点击确认时逐行校验，任一项目名称为空或金额不大于0则阻断保存并定位具体行。
      - priority: P1
        text: 确认后以项目金额之和回写当前行补贴或扣减，并重算行金额、路段小计、计划小计和全单总额；不反改联运计划费用规则。
      - priority: P1
        text: 弹窗使用当前行项目的副本编辑；取消关闭时丢弃本次未确认修改，删除全部项目后确认则回写金额0。
    field_columns: [字段, 必填, 取值规则, 保存行为]
    fields:
      - 字段: 项目名称
        必填: 是
        取值规则: 去除首尾空格后不能为空
        保存行为: 原文保存到当前明细行
      - 字段: 金额
        必填: 是
        取值规则: 数字且大于0
        保存行为: 所有项目金额求和形成补贴或扣减金额
      - 字段: 备注
        必填: 否
        取值规则: 可为空
        保存行为: 随项目明细保存，不参与计算
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved

  - id: add_submit_and_occupy
    index: ⑤
    short_index: '5'
    title: 提交校验、运单分摊与数量占用
    anchor_selector: .annotation-add-submit
    node_class: annotation-add-submit-node
    aria_label: ⑤ 提交校验、运单分摊与数量占用
    page_scope: add
    purpose: 定义提交前校验、正式结算单生成和内部运单数量占用必须在同一事务中完成。
    rules:
      - priority: P0
        text: 提交必须校验结算对象、结算方、结算日期、至少一个计划、计划仍可结算、费用规则完整、结算量边界、单价大于0、基础运费计算成功以及补贴扣减字段合法。
      - priority: P0
        text: 提交时重新读取最新有效占用；若同一内部运单的同一数量范围已被其他有效结算单占用，必须阻断且不得生成结算单。
      - priority: P0
        text: 当本次结算量小于未结算量时，按当前明细行对应内部运单的结算依据形成时间升序分摊，逐单占满本次量；不同货品、箱型、子计划和量纲独立分摊。
      - priority: P0
        text: 生成结算单、写入全部占用记录和进入待审核必须原子成功；任一步失败整体回滚。OA驳回或作废时释放全部占用。
    field_columns: [占用记录字段, 取值来源, 规则]
    fields:
      - 占用记录字段: 结算身份
        取值来源: 结算单号、结算方、联运计划号
        规则: 每条占用可追溯到本次正式结算单
      - 占用记录字段: 结算颗粒度
        取值来源: 子计划号（分段必填）、货品/箱型、计费条件、计费依据、量纲
        规则: 整票按计划+明细行；分段按子计划+明细行+量纲
      - 占用记录字段: 内部运单
        取值来源: 内部运单号及对应装货确认、卸货确认或箱型箱数记录
        规则: 按依据形成时间顺序分摊
      - 占用记录字段: 数量快照
        取值来源: 本次结算量、本次占用量、结算前累计已结算量、结算后累计已结算量
        规则: 占用前后数量必须可核对且不得超过可结算量
      - 占用记录字段: 审计信息
        取值来源: 标记时间和提交操作人
        规则: 作废释放时保留原记录并记录释放状态
    state_transitions:
      - from: 新建未提交
        trigger: 提交且校验、占用全部成功
        to: 待审核
        effect: 生成正式结算单和内部运单占用记录，不生成草稿
      - from: 待审核或待打款
        trigger: OA驳回或作废
        to: 已作废
        effect: 释放本单全部有效结算量占用
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved

  - id: detail_basic_and_summary
    index: ⑥
    short_index: '6'
    title: 详情快照、全单汇总与状态动作
    anchor_selector: .annotation-detail-basic
    node_class: annotation-detail-basic-node
    aria_label: ⑥ 详情快照、全单汇总与状态动作
    page_scope: detail
    purpose: 定义详情基础字段、全单金额和状态操作均读取正式结算单快照，不随上游规则变化重算。
    rules:
      - priority: P0
        text: 结算单号、主体、日期、创建信息、备注、数量、单价及金额均读取提交成功时的正式快照，详情页只读。
      - priority: P0
        text: 基础运费合计=Σ计划基础运费；补贴/扣减合计=Σ全部明细项目；结算总额=基础运费合计+补贴合计-扣减合计。
      - priority: P0
        text: 待审核由外部OA驱动；通过进入待打款，驳回进入已作废并释放占用。只有待打款显示确认打款，完成后进入已打款。
      - priority: P1
        text: 页面不提供应用内审核、OA详情、内部运单占用明细或正式结算结果编辑入口。
    status_action_matrix:
      states: [待审核, 待打款, 已打款, 已作废]
      actions: [确认打款, 参与有效已结算量, 编辑核心结算字段]
      cells:
        待审核: [隐藏, 是, 禁止]
        待打款: [显示, 是, 禁止]
        已打款: [隐藏, 是, 禁止]
        已作废: [隐藏, 否, 禁止]
      legend:
        确认打款: 仅待打款状态可执行，成功后进入已打款
        参与有效已结算量: 已作废释放占用，其余正式状态均计入
        编辑核心结算字段: 详情页所有状态都只读
    state_transitions:
      - from: 待审核
        trigger: 外部OA审核通过
        to: 待打款
        effect: 保留占用，开放确认打款
      - from: 待审核
        trigger: 外部OA驳回或作废
        to: 已作废
        effect: 释放本单占用
      - from: 待打款
        trigger: 确认打款
        to: 已打款
        effect: 结算完成并保持只读
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved

  - id: detail_plan_list
    index: ⑦
    short_index: '7'
    title: 计划级快照汇总与详情切换
    anchor_selector: .annotation-detail-plan-list
    node_class: annotation-detail-plan-list-node
    aria_label: ⑦ 计划级快照汇总与详情切换
    page_scope: detail
    purpose: 定义左侧每张计划卡片的字段来源、金额公式以及与右侧详情的同步关系。
    rules:
      - priority: P0
        text: 左侧只展示本结算单快照内的联运计划，不查询同一计划后来产生的其他结算单或最新费用规则。
      - priority: P0
        text: 每张卡片的基础运费、补贴、扣减分别汇总该计划全部明细行；核算运费=基础运费+补贴-扣减，并与右侧核算结果一致。
      - priority: P1
        text: 默认选中第一条计划；点击其他卡片只切换右侧当前计划，不改变全单汇总或结算状态。
    field_columns: [卡片字段, 数据来源, 汇总颗粒度]
    fields:
      - 卡片字段: 身份摘要
        数据来源: 提交快照中的计划号、名称/路线、结算方式
        汇总颗粒度: 一张卡片对应一个联运计划
      - 卡片字段: 货品/箱型摘要
        数据来源: 本计划参与本次结算的明细行
        汇总颗粒度: 保留货品/箱型名称及数量单位，不混合量纲
      - 卡片字段: 基础运费/补贴/扣减
        数据来源: 本计划全部明细行金额之和
        汇总颗粒度: 整票汇总货品/箱型；分段先汇总子计划再汇总计划
      - 卡片字段: 核算运费
        数据来源: 基础运费 + 补贴 - 扣减
        汇总颗粒度: 计划级，只读快照
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved

  - id: detail_fee_breakdown
    index: ⑧
    short_index: '8'
    title: 计费详情字段与核算结果
    anchor_selector: .annotation-detail-billing-type, .annotation-detail-base-fee, .annotation-detail-subsidy, .annotation-detail-deduction, .annotation-detail-result
    node_class: annotation-detail-fee-node
    aria_label: ⑧ 计费详情字段与核算结果
    page_scope: detail
    purpose: 定义右侧各字段读取的结算快照、整票与分段展示颗粒度及逐级汇总公式。
    rules:
      - priority: P0
        text: 整票按货品/箱型行展示；分段按子计划分组后再按货品/箱型展示，每段必须保留计费条件、依据、单价和量纲。
      - priority: P0
        text: 详情中的运输总量、已结算量、未结算量、本次结算量和单价都读取提交时快照，不按当前实时数据重新计算。
      - priority: P0
        text: 详情页展示结算后口径：已结算量包含本结算单的本次结算量，未结算量是扣除本次结算后的剩余量；本次结算量单独保留用于说明本单贡献。
      - priority: P0
        text: 补贴、扣减按明细项目展示；分段必须同时展示所属子计划和货品/箱型，禁止合并为不可追溯金额。
      - priority: P1
        text: 明细金额逐行计算，分段先形成路段小计，再形成计划核算运费；右侧计划结果必须与左侧卡片一致。
    field_columns: [字段, 整票详情, 分段详情, 公式或来源]
    fields:
      - 字段: 运输总量
        整票详情: 提交时按计费依据保存；装货口径取首段累计装货确认量，卸货口径取末段累计卸货确认量，集装箱按箱型取确认箱数
        分段详情: 提交时按子计划保存；装货口径取本段装货确认量，卸货口径取本段卸货确认量，集装箱按箱型取本段确认箱数
        公式或来源: 取提交瞬间数值写入结算单快照；提交后内部运单确认数据变化不回算本单
      - 字段: 已结算量
        整票详情: 提交前该行累计有效占用 + 本单该行本次结算量
        分段详情: 提交前该子计划明细行累计有效占用 + 本单该行本次结算量
        公式或来源: 包含本单本次结算量，表示结算单生效后的累计已结算量
      - 字段: 未结算量
        整票详情: 运输总量 - 详情页已结算量
        分段详情: 运输总量 - 详情页已结算量
        公式或来源: 表示本单结算完成后的剩余未结算量
      - 字段: 本次结算量
        整票详情: 本单该货品/箱型实际占用量
        分段详情: 本单该子计划明细行实际占用量
        公式或来源: 等于本单对应占用记录之和
      - 字段: 运输单价
        整票详情: 计划级统一单价或箱型单价快照
        分段详情: 子计划级统一单价或子计划箱型单价快照
        公式或来源: 读取本结算单，不读取上游最新规则
      - 字段: 基础运费/明细金额
        整票详情: 本次结算量 × 计划级/箱型单价
        分段详情: 本次结算量 × 子计划级/箱型单价
        公式或来源: 明细行只读金额
      - 字段: 补贴/扣减
        整票详情: 当前货品/箱型行项目之和
        分段详情: 当前子计划货品/箱型行项目之和
        公式或来源: 展示项目名称、归属和金额
      - 字段: 核算运费
        整票详情: Σ行基础运费 + Σ补贴 - Σ扣减
        分段详情: Σ路段(Σ行基础运费 + Σ补贴 - Σ扣减)
        公式或来源: 与左侧计划卡片和全单汇总一致
    origin: ai
    human_locked: false
    confirmation: confirmed
    human_disposition: resolved
